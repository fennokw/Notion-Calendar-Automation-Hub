name: Editable ICS to Notion Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

concurrency:
  group: editable-ics-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Sync enabled calendar sources
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SCHEDULE_DATABASE_ID: ${{ vars.SCHEDULE_DATABASE_ID }}
          CALENDAR_SOURCES_DATABASE_ID: ${{ vars.CALENDAR_SOURCES_DATABASE_ID }}
          SYNC_RUNS_DATABASE_ID: ${{ vars.SYNC_RUNS_DATABASE_ID }}
          DEFAULT_TIMEZONE: ${{ vars.DEFAULT_TIMEZONE || 'America/New_York' }}
        run: python sync_ics_to_notion.py

      - name: Sync Canvas assignments
        if: ${{ secrets.CANVAS_TOKEN != '' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          CANVAS_BASE_URL: https://canvas.mit.edu
          SCHEDULE_DATABASE_ID: ${{ vars.SCHEDULE_DATABASE_ID }}
        run: python sync_canvas_to_notion.py

      - name: Canvas token status
        if: ${{ secrets.CANVAS_TOKEN == '' }}
        run: echo "Canvas sync skipped because CANVAS_TOKEN is not configured."
